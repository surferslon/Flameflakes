# Fly.io configuration. The game keeps its state in memory, one game per connection, so there is
# no database and no volume: machines can be stopped, started and added freely.
app = "flakeslord"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true            # the page and the websocket (wss) are served over TLS
  auto_stop_machines = "stop"   # stop when nobody is playing ...
  auto_start_machines = true    # ... and start on the next visit
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    method = "GET"
    path = "/"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
